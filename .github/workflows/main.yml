name: build-zab

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: node:16-bullseye
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 清理幽灵文件
        run: |
          rm -f page/app.js page/App.js
          ls -laR page/ 2>/dev/null || echo "(无 page 目录)"

      - name: 强制注入标准 app.json（无视仓库/编辑器）
        run: |
          node -e '
            const fs = require("fs");
            const cfg = {
              app: {
                appId: 1134060,
                appType: "app",
                appName: "MathEngine",
                version: { code: 1, name: "1.0.0" },
                icon: "icon.png",
                vendor: "math-engine"
              },
              targets: {
                "2023": {
                  module: { page: { pages: ["page/index"] } },
                  designWidth: 480,
                  platforms: [{ name: "gtr4" }]
                }
              },
              runtime: { apiVersion: { compatible: "3.0.0", target: "3.0.0", minVersion: "3.0.0" } },
              permissions: [],
              configVersion: "1.0.0",
              defaultLanguage: "zh-CN"
            };
            fs.writeFileSync("app.json", JSON.stringify(cfg, null, 2));
            const j = JSON.parse(fs.readFileSync("app.json", "utf8"));
            console.log("✅ 已强制写入，app.vendor =", j.app.vendor);
            console.log(fs.readFileSync("app.json", "utf8"));
          '

      - name: Install dependencies（镜像）
        run: |
          npm config set registry https://registry.npmmirror.com
          npm config set sharp_binary_host https://npmmirror.com/mirrors/sharp
          npm config set sharp_libvips_binary_host https://npmmirror.com/mirrors/sharp-libvips
          npm install --no-audit --no-fund

      - name: Build .zab
        run: |
          echo "===== 构建前的 app.json（必须含 vendor）====="
          pwd && ls -la app.json && cat app.json
          npx zeus --version 2>/dev/null || true
          npx zeus build
          echo ""
          find . -not -path './node_modules/*' -not -path './.git/*' -type f | sort
          find . -name '*.zab' -not -path './node_modules/*' -print

      - name: 归一化产物到 dist
        run: |
          mkdir -p dist
          FOUND=$(find . -name '*.zab' -not -path './node_modules/*' | head -n 1)
          if [ -z "$FOUND" ]; then
            echo "::error::没有 .zab，请看 Build 日志"
            exit 1
          fi
          case "$FOUND" in
            ./dist/*) echo "已在 dist" ;;
            *) cp "$FOUND" dist/ ;;
          esac
          ls -la dist

      - name: Upload .zab
        uses: actions/upload-artifact@v4
        with:
          name: zab
          path: dist/*.zab
          if-no-files-found: error
