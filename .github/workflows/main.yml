name: build-zab
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: node:16-bullseye
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: npm install --no-audit --no-fund
      - name: Build
        run: npx zeus build
      - name: Upload .zab
        uses: actions/upload-artifact@v4
        with:
          name: zab-package
          path: '**/*.zab'
          if-no-files-found: error
