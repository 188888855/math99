name: build-zab

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: node:16-bullseye
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 清理幽灵文件 + 打印真相
        run: |
          rm -f page/app.js page/App.js
          echo "===== page/ 实际内容（删完幽灵后）====="
          ls -laR page/ 2>/dev/null || echo "(无 page 目录)"
          echo ""
          echo "===== 实际 app.json（vendor 到底在不在）====="
          cat app.json

      - name: Install dependencies（镜像）
        run: |
          npm config set registry https://registry.npmmirror.com
          npm config set sharp_binary_host https://npmmirror.com/mirrors/sharp
          npm config set sharp_libvips_binary_host https://npmmirror.com/mirrors/sharp-libvips
          npm install --no-audit --no-fund

      - name: Validate app.json
        run: |
          node -e "
            const fs = require('fs');
            const j = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            if (!j.app || typeof j.app !== 'object') { console.error('缺少 app 根对象'); process.exit(1); }
            if (!j.app.vendor) { console.error('❌ app.vendor 缺失！实际 app 内容：', JSON.stringify(j.app)); process.exit(1); }
            if (!j.app.appId || !j.app.appType || !j.app.appName) { console.error('app 缺必填字段'); process.exit(1); }
            console.log('✅ app.vendor =', j.app.vendor, '| appId =', j.app.appId);
          "

      - name: Build .zab
        run: |
          npx zeus build
          echo ""
          echo "===== 排查1：文件树 ====="
          find . -not -path './node_modules/*' -not -path './.git/*' -type f | sort
          echo ""
          echo "===== 排查2：.zab ====="
          find . -name '*.zab' -not -path './node_modules/*' -print
          echo ""
          echo "===== 排查3：dist ====="
          ls -laR dist 2>/dev/null || echo "(无 dist)"

      - name: 归一化产物到 dist
        run: |
          mkdir -p dist
          FOUND=$(find . -name '*.zab' -not -path './node_modules/*' | head -n 1)
          if [ -z "$FOUND" ]; then
            echo "::error::没有 .zab，请看 Build 日志"
            exit 1
          fi
          echo "找到: $FOUND"
          case "$FOUND" in
            ./dist/*) echo "已在 dist" ;;
            *) cp "$FOUND" dist/ ;;
          esac
          ls -la dist

      - name: Upload .zab
        uses: actions/upload-artifact@v4
        with:
          name: zab
          path: dist/*.zab
          if-no-files-found: error
