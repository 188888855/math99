name: build-zab

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: node:16-bullseye
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: 打印实际 app.json（排查真相）
        run: |
          echo "===== 实际 app.json 内容 ====="
          cat app.json
          echo ""
          echo "===== JSON 合法性 ====="
          node -e "JSON.parse(require('fs').readFileSync('app.json','utf8')); console.log('✅ 合法 JSON')"

      - name: Build .zab
        run: |
          npx zeus build
          echo "========== 排查1：项目文件树 =========="
          find . -not -path './node_modules/*' -not -path './.git/*' -type f | sort
          echo "========== 排查2：所有 .zab 文件 =========="
          find . -name '*.zab' -not -path './node_modules/*' -print

      - name: 归一化产物到 dist
        run: |
          mkdir -p dist
          FOUND=$(find . -name '*.zab' -not -path './node_modules/*' | head -n 1)
          if [ -z "$FOUND" ]; then
            echo "::error::没有找到任何 .zab 文件"
            exit 1
          fi
          cp "$FOUND" dist/
          echo "---------- dist 最终内容 ----------"
          ls -la dist

      - name: Upload .zab
        uses: actions/upload-artifact@v4
        with:
          name: zab
          path: dist/*.zab
          if-no-files-found: error
